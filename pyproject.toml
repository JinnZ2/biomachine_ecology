[project]
name = "biomachine-ecology"
version = "0.1.0"
description = "Scrap-built, field-repairable machines: seals, sensors, harvesters, and a glyph language for their states"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "JinnZ2"}]

dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pytest>=7.0",
]
stl = [
    "numpy>=1.20",
]

[project.scripts]
stl-generator = "regenerator.STL_generator:main"

[tool.setuptools]
packages = ["diagnostics", "regenerator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
