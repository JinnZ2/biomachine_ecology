[project]
name = "biomachine-ecology"
version = "0.1.0"
description = "Modular, adaptive, scrap-built machines coexisting with environmental decay and biological life"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "JinnZ2"}]

dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pytest>=7.0",
]
stl = [
    "numpy>=1.20",
]

[project.scripts]
stl-generator = "regenerator.STL_generator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
