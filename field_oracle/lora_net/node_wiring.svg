<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    text { font-family: monospace; font-size: 11px; fill: #333; }
    .title { font-size: 14px; font-weight: bold; }
    .label { font-size: 9px; fill: #666; }
    .node { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; rx: 8; }
    .mcu { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 4; }
    .sensor { fill: #fff3e0; stroke: #ff9800; stroke-width: 1.5; rx: 4; }
    .wire { stroke: #666; stroke-width: 1.5; fill: none; }
    .wire-power { stroke: #f44336; stroke-width: 1.5; fill: none; }
    .wire-data { stroke: #2196f3; stroke-width: 1.5; fill: none; stroke-dasharray: 4,2; }
    .wire-lora { stroke: #9c27b0; stroke-width: 2; fill: none; stroke-dasharray: 8,4; }
  </style>

  <text x="300" y="25" text-anchor="middle" class="title">BioMachine LoRa Sensor Node — Wiring Diagram</text>

  <!-- MCU -->
  <rect x="220" y="60" width="160" height="80" class="mcu"/>
  <text x="300" y="85" text-anchor="middle">MCU (ESP32 / ATmega)</text>
  <text x="300" y="100" text-anchor="middle" class="label">3.3V Logic</text>
  <text x="230" y="120" class="label">GPIO / I2C / ADC</text>

  <!-- LoRa Module -->
  <rect x="440" y="70" width="120" height="50" class="node"/>
  <text x="500" y="95" text-anchor="middle">LoRa SX1276</text>
  <text x="500" y="110" text-anchor="middle" class="label">868 MHz</text>
  <line x1="380" y1="90" x2="440" y2="90" class="wire-data"/>
  <text x="405" y="85" text-anchor="middle" class="label">SPI</text>

  <!-- Antenna -->
  <line x1="500" y1="70" x2="500" y2="45" class="wire"/>
  <line x1="490" y1="45" x2="510" y2="45" class="wire"/>
  <line x1="485" y1="40" x2="515" y2="40" class="wire"/>
  <text x="500" y="35" text-anchor="middle" class="label">Antenna</text>

  <!-- Power -->
  <rect x="40" y="70" width="120" height="50" class="node"/>
  <text x="100" y="95" text-anchor="middle">Power 3.3V</text>
  <text x="100" y="110" text-anchor="middle" class="label">LDO / Solar</text>
  <line x1="160" y1="90" x2="220" y2="90" class="wire-power"/>
  <text x="190" y="85" text-anchor="middle" class="label">VCC</text>

  <!-- Sensors -->
  <rect x="40" y="180" width="130" height="40" class="sensor"/>
  <text x="105" y="205" text-anchor="middle">VOC (MQ-135)</text>
  <line x1="170" y1="200" x2="260" y2="140" class="wire-data"/>
  <text x="200" y="175" class="label">ADC</text>

  <rect x="40" y="240" width="130" height="40" class="sensor"/>
  <text x="105" y="265" text-anchor="middle">Temp / Humidity</text>
  <line x1="170" y1="260" x2="280" y2="140" class="wire-data"/>
  <text x="200" y="230" class="label">I2C</text>

  <rect x="40" y="300" width="130" height="40" class="sensor"/>
  <text x="105" y="325" text-anchor="middle">Conductivity</text>
  <line x1="170" y1="320" x2="300" y2="140" class="wire-data"/>
  <text x="200" y="290" class="label">ADC</text>

  <rect x="430" y="180" width="130" height="40" class="sensor"/>
  <text x="495" y="205" text-anchor="middle">UV Sensor</text>
  <line x1="430" y1="200" x2="340" y2="140" class="wire-data"/>

  <rect x="430" y="240" width="130" height="40" class="sensor"/>
  <text x="495" y="265" text-anchor="middle">Pressure (seal)</text>
  <line x1="430" y1="260" x2="360" y2="140" class="wire-data"/>

  <rect x="430" y="300" width="130" height="40" class="sensor"/>
  <text x="495" y="325" text-anchor="middle">Touch / Capacitive</text>
  <line x1="430" y1="320" x2="340" y2="140" class="wire-data"/>

  <!-- LoRa broadcast indicator -->
  <path d="M 540 55 Q 560 30 580 55" class="wire-lora"/>
  <path d="M 545 50 Q 565 20 585 50" class="wire-lora"/>
  <text x="563" y="15" text-anchor="middle" class="label">RF</text>

  <!-- Legend -->
  <text x="40" y="380" class="label">Legend:</text>
  <line x1="90" y1="377" x2="120" y2="377" class="wire-power"/>
  <text x="125" y="380" class="label">Power</text>
  <line x1="170" y1="377" x2="200" y2="377" class="wire-data"/>
  <text x="205" y="380" class="label">Data (I2C/SPI/ADC)</text>
  <line x1="300" y1="377" x2="330" y2="377" class="wire-lora"/>
  <text x="335" y="380" class="label">LoRa RF</text>
</svg>
