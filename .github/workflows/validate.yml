name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate JSON syntax and schemas
        run: python -m pytest tests/ -v

      - name: Check Python syntax
        run: python -m compileall -q diagnostics regenerator tests

      - name: Generate a test STL
        run: |
          python regenerator/STL_generator.py --inner-radius 5 --outer-radius 10 -o /tmp/test.stl
          test -s /tmp/test.stl

      - name: Check glyph index columns
        run: |
          python - <<'EOF'
          import csv, sys
          with open("materials_glyph_bank/glyph-index.csv") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
          missing = {"glyph", "name", "category"} - set(reader.fieldnames or [])
          if missing:
              sys.exit(f"Missing columns: {missing}")
          print(f"{len(rows)} glyphs registered")
          EOF
